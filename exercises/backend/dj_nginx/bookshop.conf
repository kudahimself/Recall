# The bookshop's Nginx site: a first try that serves the site over plain HTTP only.
# It breaks the rules in dj_nginx/README.md: fix it so the tests in
# test_bookshop_proxy.py pass.
server {
    listen 80;
    server_name books.example.org;

    location /static {
        root /srv/bookshop/collected;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
