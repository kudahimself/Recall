<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book card - Corner Books</title>
    <link rel="stylesheet" href="theme.css">
  </head>
  <body class="bg-gray-100 p-6">
    <article id="night-circus" class="group flex flex-col gap-4 rounded-lg bg-white p-4 shadow-md hover:shadow-lg sm:flex-row">
      <img class="w-full rounded sm:w-32" src="night-circus.jpg" alt="The cover of The Night Circus">
      <div>
        <h2 class="text-lg font-semibold group-hover:text-brand-500">The Night Circus</h2>
        <p class="author text-sm text-gray-600">Erin Morgenstern</p>
        <p class="price mt-2 text-[15px] font-bold">£9.99</p>
        <button class="mt-4 rounded bg-brand-500 px-4 py-2 text-white hover:bg-brand-600 focus-visible:outline-2 focus-visible:outline-offset-2 disabled:opacity-50" type="button">Add to basket</button>
      </div>
    </article>
    <article id="piranesi" class="group flex flex-col gap-4 rounded-lg bg-white p-4 shadow-md hover:shadow-lg sm:flex-row">
      <img class="w-full rounded sm:w-32" src="piranesi.jpg" alt="The cover of Piranesi">
      <div>
        <h2 class="text-lg font-semibold group-hover:text-brand-500">Piranesi</h2>
        <p class="author text-sm text-gray-600">Susanna Clarke</p>
        <p class="price mt-2 text-[15px] font-bold">£8.99</p>
        <button class="mt-4 rounded bg-brand-500 px-4 py-2 text-white hover:bg-brand-600 focus-visible:outline-2 focus-visible:outline-offset-2 disabled:opacity-50" type="button" disabled>Sold out</button>
      </div>
    </article>
  </body>
</html>
