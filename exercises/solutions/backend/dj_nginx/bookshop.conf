# The bookshop's Nginx site: HTTPS only, files from disk, everything else to Gunicorn.
upstream bookshop_app {
    server 127.0.0.1:8000;                        # where Gunicorn listens
}

server {
    listen 80;
    server_name books.example.org;
    return 301 https://$host$request_uri;         # plain HTTP -> HTTPS
}

server {
    listen 443 ssl;
    server_name books.example.org;
    ssl_certificate     /etc/letsencrypt/live/books.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/books.example.org/privkey.pem;

    location /static/ {
        alias /srv/bookshop/collected/;           # /static/x -> /srv/bookshop/collected/x
    }

    location /media/ {
        root /srv/bookshop;                       # /media/x -> /srv/bookshop/media/x
    }

    location / {
        proxy_pass http://bookshop_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
