<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book card - Corner Books</title>
    <link rel="stylesheet" href="theme.css">
  </head>
  <!-- TODO: style the two cards with Tailwind classes. README.md lists what each part looks like. -->
  <body>
    <article id="night-circus">
      <img src="night-circus.jpg" alt="The cover of The Night Circus">
      <div>
        <h2>The Night Circus</h2>
        <p class="author">Erin Morgenstern</p>
        <p class="price">£9.99</p>
        <button type="button">Add to basket</button>
      </div>
    </article>
    <article id="piranesi">
      <img src="piranesi.jpg" alt="The cover of Piranesi">
      <div>
        <h2>Piranesi</h2>
        <p class="author">Susanna Clarke</p>
        <p class="price">£8.99</p>
        <button type="button" disabled>Sold out</button>
      </div>
    </article>
  </body>
</html>
